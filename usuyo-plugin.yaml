# 小红书获取插件（设计见 usuyo 仓库 docs/platforms/rednote.md §2）。
# 只按你交来的笔记链接取公开笔记页，不登录、不签名；收藏、赞过的清单由 userscript/ 里的脚本交给 usuyo：
# 在 usuyo 的站点窗口里（in-usuyo），或在你自己浏览器的脚本管理器里（userscript）。
protocol: 1
id: usuyo-fetch/rednote
kind: fetch
name: 小红书
description: 按你存过的笔记链接取公开笔记页的正文、图片和视频，做个人备份
version: 0.1.0
license: MIT
maintainers: [fldicoahkiin]
upstream:
  - name: xhs-vault
    url: https://github.com/wkwunju/xhs-vault
    license: MIT
  - name: XHS-Downloader（笔记页状态对象的字段名，只读它的源码，没有用它的代码）
    url: https://github.com/JoeanAmier/XHS-Downloader
    license: GPL-3.0
  - name: MediaCrawler（视频分档不认档名的做法，只读它的源码，没有用它的代码）
    url: https://github.com/NanmiCoder/MediaCrawler
    license: NON-COMMERCIAL LEARNING LICENSE 1.1
  - name: ParseHub（第一个请求就带访客身份的先后、新的图片主机，只读它的源码，没有用它的代码）
    url: https://github.com/z-mio/ParseHub
    license: MIT
platforms: [rednote]
match:
  - "www.xiaohongshu.com/explore/*"
  - "www.xiaohongshu.com/search_result/*"
  - "www.xiaohongshu.com/discovery/item/*"
  - "www.xiaohongshu.com/user/profile/*"
  - "xhslink.com/*"
  - "xhslink.cn/*"
# 账号只在 usuyo 给小红书单开的站点窗口里（browser-profile）：你在窗口里登录，cookie 留在那一份网页数据里，
# usuyo 不读出来、不交给插件进程；登录后的页面里跑 userscript/usuyo-xhs-window.js，只交链接。
# 登录后才有的 cookie 名没有核实过，所以不写 cookies：登录好没有由脚本读页面里登录的账号来认。
sites:
  - site: www.xiaohongshu.com
    name: 小红书
    credential: browser-profile
    loginUrl: https://www.xiaohongshu.com/explore
    domains: [".xiaohongshu.com"]
# 访客身份不是账号：usuyo 开一次首页、不登录，存下页面自己生成的 cookie，经 USUYO_VISITOR 交给笔记页请求；
# 笔记页的第一个请求就带它，没交来时不发请求、回 visitor-required。
visitors:
  - site: www.xiaohongshu.com
    name: 小红书
    url: https://www.xiaohongshu.com/
    # 这三个都出现了才算取到：a1、webId 照 ParseHub provider_api/xhs.py:56（游客 session 先有这两个）；
    # web_session 是 ParseHub 游客那一路带去笔记页的唯一一个（xhs.py:53-78），
    # MediaCrawler media_platform/xhs/login.py:191-193 在没登录的浏览器里也读到它。别的名字没有出处，不写。
    cookies: [a1, webId, web_session]
# 几种方法各列一项（usuyo 协议 §2.3.1），没做的也列；行和 usuyo 仓库 docs/platforms/routes.md 第 3 节一一对应。
methods:
  # 先带访客身份（和取它时窗口的 UA）请求网页版笔记页；这份不被收（送去登录页、首页、没给内容）时，
  # 再用手机版页面取一次：iPhone Safari 的 UA，不使用账号、不带任何 cookie（ParseHub parsers/parser/xhs.py:36-58
  # 的第三段）。验证页、/404/sec 马上停，不换手机版去试。
  - id: note-page
    name: 公开笔记页
    access: public-web
    login: none
    account: visitor
    visitors: [www.xiaohongshu.com]
    risk:
      text: 空 cookie 的长链被送回首页；不填 cookie 批量取约 108 条后，复制链接的账号被下线
      source: {label: "XHS-Downloader #305", url: "https://github.com/JoeanAmier/XHS-Downloader/issues/305"}
    capabilities:
      fetch:
        outputs: [text, images, media:video, subtitle, meta]
  # 在 usuyo 的站点窗口里登录，脚本打开你的个人页、点「收藏」再点「赞过」（页面上写「点赞」），usuyo 隔几秒叫它往下翻一屏；
  # 只看页面自己请求回来的列表，记下笔记 id、xsec_token 和标题，交给 usuyo 落成导入，确认后由 note-page 去取。
  - id: in-usuyo
    name: 在 usuyo 中登录并读取
    access: browser-session
    login: required
    account: in-usuyo
    sites: [www.xiaohongshu.com]
    delivers: links
    script: userscript/usuyo-xhs-window.js
    guide: 登录以后打开你的个人页，先读「收藏」再读「赞过」（页面上写「点赞」），只记页面自己请求回来的列表；默认隔几秒往下翻一屏，每读完一个列表就发送到 usuyo，都读过了自己结束；碰到验证页、要登录时停下
    risk:
      text: 自动往下翻是用你的账号做的自动操作，比你自己翻高一级；网页对采集类扩展弹「有害插件」
      source: {label: "XHS-Downloader #283", url: "https://github.com/JoeanAmier/XHS-Downloader/issues/283"}
  - id: userscript
    name: 浏览器脚本（收藏、赞过）
    access: browser-session
    login: required
    account: own-browser
    delivers: links
    script: userscript/usuyo-xhs-saved.user.js
    risk:
      text: 网页对采集类扩展弹「有害插件」；只截获、不发请求的脚本没有处罚报告
      source: {label: "XHS-Downloader #283", url: "https://github.com/JoeanAmier/XHS-Downloader/issues/283"}
  - id: iphone
    name: iPhone 镜像
    built: false
    access: vision-ui
    login: required
    account: own-phone
    interaction: foreground
    drives: iphone
    capabilities:
      list:
        sources:
          - {source: "rednote:favorites", title: 收藏, action: favorite}
          - {source: "rednote:likes", title: 赞过, action: like}
  - id: android
    name: 安卓手机
    built: false
    access: vision-ui
    login: required
    account: own-phone
    interaction: foreground
    drives: android
    capabilities:
      list:
        sources:
          - {source: "rednote:favorites", title: 收藏, action: favorite}
          - {source: "rednote:likes", title: 赞过, action: like}
# 两次请求之间隔 15 到 25 秒，每次随机；被拦（验证页、风控码）以后 usuyo 停下整个小红书，等你点「继续获取」，不自己接着。
pacing:
  rednote: {batch: true, interval: 15s, intervalMax: 25s, daily: 100, blocked: stop}
permissions:
  fs:
    write: ["${OUT}"]
  network:
    mode: allowlist
    hosts: ["www.xiaohongshu.com", "xhslink.com", "xhslink.cn", "*.xhscdn.com", "*.rednotecdn.com"]
  env: []
  devices: []
  gpu: false
run:
  command: ["${PLUGIN_DIR}/usuyo-fetch-rednote"]
