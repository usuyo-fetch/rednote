[package]
name = "usuyo-fetch-rednote"
description = "usuyo 的小红书获取插件：按你存过的笔记链接取公开笔记页，做个人备份和离线阅读"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

# 独立仓库，不并进别的工作区。
[workspace]

[[bin]]
name = "usuyo-fetch-rednote"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
usuyo-plugin-kit = { git = "https://github.com/usuyo/usuyo", rev = "4c6aeda10659fc4ab5457cd5c18086b5facdae94" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
usuyo-plugin = { git = "https://github.com/usuyo/usuyo", rev = "4c6aeda10659fc4ab5457cd5c18086b5facdae94" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
